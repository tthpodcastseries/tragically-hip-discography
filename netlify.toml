# Static site - publish the repo root as-is, no build step
[build]
  publish = "."

# Feature pages - /lyrics, /setlists and /top-40 are real files (lyrics.html,
# setlists.html, top-40.html) written by scripts/build-seo-pages.js, so link
# previews see their own tags; /my-shows is the Yer Hip Passport (passport.html)
[[redirects]]
  from = "/my-shows"
  to = "/passport.html"
  status = 200

# Song pages - /song/<slug> is a real file (song/<slug>.html, written by
# scripts/build-seo-pages.js); an unknown slug gets the 404 page with a real 404.
# /song (the list of all songs) is song.html
[[redirects]]
  from = "/song"
  to = "/song.html"
  status = 200

[[redirects]]
  from = "/song/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/audits/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/live-play-counts-unmatched.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/source/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
