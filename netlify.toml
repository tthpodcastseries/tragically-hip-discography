# Static site - publish the repo root as-is, no build step
[build]
  publish = "."

# Feature pages (v4.7) - /lyrics, /setlists and /top-40 are served by
# discography.html, which switches into the matching view from the path;
# /my-shows is the Yer Hip Passport (passport.html, v5)
[[redirects]]
  from = "/lyrics"
  to = "/discography.html"
  status = 200

[[redirects]]
  from = "/setlists"
  to = "/discography.html"
  status = 200

[[redirects]]
  from = "/top-40"
  to = "/discography.html"
  status = 200

[[redirects]]
  from = "/my-shows"
  to = "/passport.html"
  status = 200

# Song pages (v5.1) - /song/<slug> is served by song.html, which reads the slug
[[redirects]]
  from = "/song"
  to = "/song.html"
  status = 200

[[redirects]]
  from = "/song/*"
  to = "/song.html"
  status = 200

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/audits/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/live-play-counts-unmatched.txt"
  to = "/404.html"
  status = 404
  force = true
