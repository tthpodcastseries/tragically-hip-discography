name: Supabase keepalive

# Supabase pauses free-tier projects after 7 days without API activity,
# which locks members out of the gate until someone restores it by hand.
# This pings the database four times a week so the project never counts as idle.
#
# The anon key below is NOT a secret - it ships in the site's public JS
# (js/tth-member-gate.js) and is safe by design; row-level security and
# the RPC signatures are the actual protection.
#
# If this job FAILS, the project is unreachable - almost certainly paused.
# Restore it at https://supabase.com/dashboard (project deqslacywpwnjjckdygp
# -> Restore), then re-run this workflow to confirm it's back.
#
# GitHub switches scheduled workflows off in a public repo after 60 days with no
# commits. If the repo goes quiet that long, re-enable this one (and the weekly
# site audit) under GitHub > Actions, or Supabase pauses about a week later.

on:
  schedule:
    # Mon/Wed/Fri/Sun 9am Toronto (13:00 UTC) - never more than 2 days between pings
    - cron: '0 13 * * 0,1,3,5'
  workflow_dispatch: {}

# This job never touches the repo (one curl), so its token gets read-only access.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (touches the database so the project registers activity)
        run: |
          URL="https://deqslacywpwnjjckdygp.supabase.co"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlcXNsYWN5d3B3bmpqY2tkeWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNTQyNjEsImV4cCI6MjA5MDczMDI2MX0.rrawa18owCmKbmryWRi6ROJX146FTqis2OGVT68K7jM"
          # Up to 3 tries, 20 seconds apart, so a passing network blip on GitHub's side
          # doesn't raise a false alarm (audit REL-03). -sS prints curl's own error
          # (name lookup, timeout...) so a failure says whether the project is paused
          # or the runner just couldn't reach it.
          for TRY in 1 2 3; do
            STATUS=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" --max-time 30 \
              -X POST "$URL/rest/v1/rpc/unlock_member" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -d '{"p_first_name":"keepalive_ping","p_number":0}') || STATUS="000"
            echo "Try $TRY - HTTP status: $STATUS"
            head -c 300 /tmp/resp.txt 2>/dev/null || true; echo
            # Any real HTTP answer (2xx-4xx) means the database was reached and
            # activity registered. Connection failure (000) or 5xx means the
            # project is paused or down.
            if [ "$STATUS" != "000" ] && [ "$STATUS" -lt 500 ]; then
              echo "Supabase is awake - activity registered."
              exit 0
            fi
            [ "$TRY" -lt 3 ] && sleep 20
          done
          echo "::error::Supabase unreachable after 3 tries (last status $STATUS) - project is likely PAUSED."
          echo "::error::Restore it: https://supabase.com/dashboard -> project -> Restore, then re-run this workflow."
          exit 1
