name: Weekly site audit

# Weekly: the full audit, outside links included, plus the YouTube check and the
# 'Little Bones' clip check.
# Every push to main: the quick pre-push check (no outside links), so a push that
# skipped it still raises a failure email within a minute or two (v5.4.18, audit
# CODE-06). Netlify runs the same check before it publishes, so a push that fails
# it normally never goes live. On a push, the game schedules are also compared with
# the commit before the push, so the whole history is fetched (audit GAME-01, CODE-03).
on:
  push:
    branches: [main]
  schedule:
    # Mondays 9am Toronto (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Quick audit, games compared with the commit before the push
        if: github.event_name == 'push'
        env:
          BEFORE_PUSH: ${{ github.event.before }}
        run: node scripts/audit-site.js --no-network --game-ref "$BEFORE_PUSH"
      - name: Full site audit (links, assets, data integrity)
        if: github.event_name != 'push'
        run: node scripts/audit-site.js

  # Weekly only, and never part of the Netlify build: asks Backblaze for the first bytes of
  # every 'Little Bones' clip, so a missing file raises an email before its day comes up.
  clips:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check every 'Little Bones' clip is still on Backblaze
        run: node scripts/check-clip-files.js

  youtube:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check YouTube video liveness (archive, show videos, music videos, Road episodes)
        run: node scripts/check-youtube-videos.js --json youtube-report.json
      - name: Upload dead-video report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-report
          path: youtube-report.json
          if-no-files-found: ignore
