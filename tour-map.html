<link rel="manifest" href="/manifest.json">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://a.basemaps.cartocdn.com">
<link rel="preconnect" href="https://b.basemaps.cartocdn.com">
<link rel="preload" href="/fonts/poppins-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/poppins-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/vendor/leaflet-1.9.4.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
<link rel="stylesheet" href="/css/vendor/MarkerCluster-1.5.3.css" integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc=" crossorigin="anonymous" />
<link rel="stylesheet" href="/css/vendor/MarkerCluster.Default-1.5.3.css" integrity="sha256-YSWCMtmNZNwqex4CEw1nQhvFub2lmU7vcCKP+XVwwXA=" crossorigin="anonymous" />
<link rel="stylesheet" href="/css/shared.css">
  <link rel="stylesheet" href="/css/tour-map.css">
</head>
<body>
<script src="/js/tth-member-gate.js"></script>
<a href="#map" class="skip-link">Skip to map</a>

<header class="map-header">
  <h1><span class="the">THE</span> TRAGICALLY HIP - About This Map</h1>
  <a href="index.html" class="back-link">← Home</a>
</header>

<main id="main-content">

<div class="otd-banner" id="otdBanner">
  <div class="otd-title" id="otdTitle">On This Day</div>
  <div class="otd-detail" id="otdDetail">Checking the tour data...</div>
</div>

<nav aria-label="Map filters" class="controls">
  <!-- Phones: the filters fold away behind this button so the map starts on the first screen (audit DEV-02) -->
  <button type="button" class="filters-toggle" id="filtersToggle" aria-expanded="false" aria-controls="mapFilters yearSlider">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
    Filters
  </button>
  <div class="map-filters" id="mapFilters">
  <div class="control-group">
    <label for="tourFilter">Tour</label>
    <select id="tourFilter">
      <option value="all">All Tours</option>
    </select>
  </div>
  <div class="control-group">
    <label for="countryFilter">Country</label>
    <select id="countryFilter">
      <option value="all">All Countries</option>
    </select>
  </div>
  <button class="play-btn" id="playBtn" title="Watch the tours unfold chronologically">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    Play Timeline
  </button>
  <button id="resetBtn" title="Reset to show all gigs">Reset</button>
  <button id="myShowsBtn" title="Show only gigs you attended">My Shows <span id="myShowsCount" class="iwt-counter">0</span></button>
  <div class="control-group search-group">
    <label for="gigSearch">Search</label>
    <div class="search-wrap">
      <input type="text" id="gigSearch" placeholder="Venue, city, or date..." autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="searchResults">
      <button id="searchClear" class="search-clear" aria-label="Clear search">&times;</button>
      <div class="search-results" id="searchResults" role="listbox" aria-label="Matching shows"></div>
      <div class="vh" id="searchStatus" role="status" aria-live="polite"></div>
    </div>
  </div>
  </div>
  <div class="stats-pill" id="statsPill">Loading...</div>
</nav>

<div class="year-slider-container" id="yearSlider">
  <div class="year-labels" style="--max:2022" aria-hidden="true">
    <span class="yl-min">1985</span><span style="--y:1990">1990</span><span style="--y:1995">1995</span><span style="--y:2000">2000</span><span style="--y:2005">2005</span><span style="--y:2010">2010</span><span style="--y:2016">2016</span><span class="yl-max">2022</span>
  </div>
  <div class="year-range-wrap">
    <div class="slider-track"></div>
    <div class="slider-track-fill" id="trackFill"></div>
    <input type="range" id="yearMin" min="1985" max="2022" value="1985" step="1" aria-label="Start year">
    <input type="range" id="yearMax" min="1985" max="2022" value="2022" step="1" aria-label="End year">
  </div>
  <div class="year-display" id="yearDisplay">1985 - 2022</div>
</div>

<div id="map"></div>

<div class="playback-overlay" id="playbackOverlay">
  <div class="playback-left">
    <div class="playback-year" id="playbackYear">1985</div>
    <div class="playback-year-gigs" id="playbackYearGigs">0 shows this year</div>
  </div>
  <div class="playback-divider"></div>
  <div class="playback-stats">
    <div class="playback-stat">
      <div class="playback-stat-val" id="pbTotal">0</div>
      <div class="playback-stat-label">Total Gigs</div>
    </div>
    <div class="playback-stat">
      <div class="playback-stat-val" id="pbCities">0</div>
      <div class="playback-stat-label">Cities</div>
    </div>
    <div class="playback-stat">
      <div class="playback-stat-val" id="pbCountries">0</div>
      <div class="playback-stat-label">Countries</div>
    </div>
  </div>
  <div class="speed-controls">
    <button class="speed-btn" data-speed="1200">Slow</button>
    <button class="speed-btn active" data-speed="800">Normal</button>
    <button class="speed-btn" data-speed="400">Fast</button>
  </div>
</div>

<div class="gig-flash" id="gigFlash"></div>
</main>

<script src="/js/map-key.js"></script>
<script src="/js/vendor/leaflet-1.9.4.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="/js/vendor/leaflet.markercluster-1.5.3.js" integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg=" crossorigin="anonymous"></script>
<script src="/js/tour-map.js"></script>

<!-- SHOW DETAIL OVERLAY -->
<div class="show-detail-overlay" id="showDetailOverlay" role="dialog" aria-modal="true" aria-labelledby="sdVenue">
  <div class="show-detail-card">
    <button class="show-detail-close" id="showDetailClose" aria-label="Close">&times;</button>
    <div class="show-detail-date" id="sdDate"></div>
    <div class="show-detail-venue" id="sdVenue"></div>
    <div class="show-detail-city" id="sdCity"></div>
    <div class="show-detail-tour" id="sdTour"></div>
    <div class="show-detail-songs" id="sdSongs"></div>
    <div class="show-detail-actions" id="sdActions"></div>
  </div>
</div>

<!-- SETLIST OVERLAY -->
<div class="setlist-overlay" id="setlistOverlay" role="dialog" aria-modal="true" aria-labelledby="slVenue">
  <div class="setlist-card">
    <button class="setlist-close" id="setlistClose" aria-label="Close">&times;</button>
    <div class="setlist-date" id="slDate"></div>
    <div class="setlist-venue" id="slVenue"></div>
    <div class="setlist-city" id="slCity"></div>
    <div class="setlist-tour" id="slTour"></div>
    <div class="setlist-songs-wrap" id="slSongsWrap"></div>
    <div class="setlist-count" id="slCount"></div>
    <div class="setlist-actions" id="slActions"></div>
    <div class="setlist-credit" id="slCredit"></div>
  </div>
</div>

<!-- AUDIO PLAYER -->
<div class="audio-player" id="audioPlayer" role="region" aria-label="Audio player">
  <div class="ap-progress-wrap" id="apProgressWrap">
    <div class="ap-progress-bar" id="apProgressBar"></div>
    <input type="range" class="ap-seek" id="apSeek" min="0" max="100" step="0.1" value="0" aria-label="Seek" aria-valuetext="0:00 of 0:00">
  </div>
  <div class="ap-loading" id="apLoading">
    <div class="ap-loading-text" id="apLoadingText">Loading show...</div>
    <div class="ap-loading-sub" id="apLoadingSub">Getting the recordings ready</div>
    <div class="ap-loading-bar"><div class="ap-loading-fill" id="apLoadingFill"></div></div>
  </div>
  <div class="ap-main">
    <div class="ap-controls">
      <button class="ap-btn" id="apPrev" title="Previous track" aria-label="Previous track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ap-btn ap-btn-play" id="apPlayPause" title="Play" aria-label="Play">
        <svg viewBox="0 0 24 24" fill="currentColor" id="apPlayIcon" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ap-btn" id="apNext" title="Next track" aria-label="Next track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
    <div class="ap-info">
      <div class="ap-show-title" id="apShowTitle">No show loaded</div>
      <div class="ap-track-title" id="apTrackTitle" role="status" aria-live="polite">-</div>
    </div>
    <div class="ap-time" id="apTime">0:00 / 0:00</div>
    <div class="ap-volume">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#929292"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" id="apVolume" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
    </div>
    <button class="ap-btn" id="apListToggle" title="Show tracklist" aria-label="Show tracklist" aria-expanded="false" aria-controls="apTracklist">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    </button>
    <button class="ap-close" id="apClose" title="Close player" aria-label="Close player">&times;</button>
  </div>
  <div class="ap-tracklist" id="apTracklist"></div>
</div>

<!-- AUDIO PLAYER JS -->
<script src="/js/track-names.js"></script>
<script src="/js/tour-map-player.js"></script>

<footer id="site-footer"></footer>

<script src="/js/dialog-a11y.js"></script>
<script src="/js/shared-footer.js"></script>
</body>
</html>
